<!-- @dsCard group="Формы" height=230 -->
<div style="padding:24px;background:var(--bg);color:var(--fg);font-family:var(--font-text)"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px">
<div class="field"><label class="field__label" for="p1">Программа или направление</label><input class="input" id="p1" placeholder="Например, 09.03.04"><span class="field__hint">Ищем по названию и коду</span></div>
<div class="field"><label class="field__label" for="p2">Институт</label><select class="select" id="p2"><option>Все институты</option><option>ИРИТ-РтФ</option></select></div>
<div class="field"><label class="field__label" for="p3">Математика (профиль)</label><input class="input input--score" id="p3" value="38" aria-invalid="true"><span class="field__error">Минимум для подачи — 40 баллов</span></div>
</div>
<div style="display:flex;gap:24px;margin-top:16px"><label class="check"><input type="checkbox" checked> Только бюджет</label><label class="check"><input type="checkbox"> Есть общежитие</label></div></div>
